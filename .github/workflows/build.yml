name: Build English Pro

concurrency:
  group: english-pro-android-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, 'planning/**']
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files
        run: flutter create --platforms=android --org com.englishpro.app --project-name english_pro /tmp/english_pro
      - name: Configure Android notification scheduling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path('/tmp/english_pro/android/app/build.gradle.kts')
          text = gradle.read_text()
          if 'isCoreLibraryDesugaringEnabled = true' not in text:
              text = text.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true', 1)
          if 'coreLibraryDesugaring(' not in text:
              text += '\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
          gradle.write_text(text)
          manifest = Path('/tmp/english_pro/android/app/src/main/AndroidManifest.xml')
          xml = manifest.read_text()
          if 'android.permission.RECEIVE_BOOT_COMPLETED' not in xml:
              xml = xml.replace('<application', '    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <application', 1)
          if 'android.permission.RECORD_AUDIO' not in xml:
              xml = xml.replace('<application', '    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <application', 1)
          receivers = '''        <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />
                  <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED"/>
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>
                          <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                          <action android:name="com.htc.intent.action.QUICKBOOT_POWERON"/>
                      </intent-filter>
                  </receiver>
          '''
          if 'ScheduledNotificationBootReceiver' not in xml:
              xml = xml.replace('</application>', receivers + '\n    </application>', 1)
          if '<queries>' not in xml:
              xml = xml.replace('</manifest>', '''    <queries>
                      <intent><action android:name="android.intent.action.TTS_SERVICE"/></intent>
                      <intent><action android:name="android.speech.RecognitionService"/></intent>
                  </queries>
          </manifest>''', 1)
          manifest.write_text(xml)
          PY
      - name: Copy application source
        run: |
          cp pubspec.yaml /tmp/english_pro/pubspec.yaml
          cp -r lib/. /tmp/english_pro/lib/
          rm -rf /tmp/english_pro/test
          mkdir -p /tmp/english_pro/test
          cp -r test/. /tmp/english_pro/test/
          cd /tmp/english_pro
          flutter pub get
      - name: Check Dart code
        working-directory: /tmp/english_pro
        run: flutter analyze --no-fatal-infos
      - name: Test curriculum integrity
        working-directory: /tmp/english_pro
        run: flutter test
      - name: Build Android APK
        working-directory: /tmp/english_pro
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: English-Pro-Android-APK
          path: /tmp/english_pro/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
