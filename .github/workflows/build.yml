name: Build English Pro

on:
  push:
    branches: [main, 'planning/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android and Web platform files
        run: flutter create --platforms=android,web --org com.englishpro.app --project-name english_pro /tmp/english_pro
      - name: Configure Android notification scheduling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path('/tmp/english_pro/android/app/build.gradle.kts')
          text = gradle.read_text()
          if 'isCoreLibraryDesugaringEnabled = true' not in text:
              text = text.replace('compileOptions {', 'compileOptions {\\n        isCoreLibraryDesugaringEnabled = true', 1)
          if 'coreLibraryDesugaring(' not in text:
              text = text.replace('dependencies {', 'dependencies {\\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")', 1)
          gradle.write_text(text)
          manifest = Path('/tmp/english_pro/android/app/src/main/AndroidManifest.xml')
          xml = manifest.read_text()
          if 'android.permission.RECEIVE_BOOT_COMPLETED' not in xml:
              xml = xml.replace('<application', '    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\\n    <application', 1)
          receivers = '''        <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />
                  <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED"/>
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>
                          <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                          <action android:name="com.htc.intent.action.QUICKBOOT_POWERON"/>
                      </intent-filter>
                  </receiver>
          '''
          if 'ScheduledNotificationBootReceiver' not in xml:
              xml = xml.replace('</application>', receivers + '\\n    </application>', 1)
          manifest.write_text(xml)
          PY
      - name: Copy application source
        run: |
          cp pubspec.yaml /tmp/english_pro/pubspec.yaml
          cp -r lib/. /tmp/english_pro/lib/
          rm -rf /tmp/english_pro/test
          cd /tmp/english_pro
          flutter pub get
      - name: Check Dart code
        working-directory: /tmp/english_pro
        run: flutter analyze
      - name: Build Android APK
        working-directory: /tmp/english_pro
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: English-Pro-Android-APK
          path: /tmp/english_pro/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
